<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER META IA</title>
<style>
body{font-family:Arial,sans-serif;background:#0b141a;color:white;margin:0;padding:0}
.header{background:#075e54;padding:15px;text-align:center;font-size:22px;font-weight:bold}
#paywall{max-width:400px;margin:40px auto;background:white;color:black;padding:20px;border-radius:15px;text-align:center}
#paywall input{width:90%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;text-transform:uppercase}
#paywall button{background:#25D366;border:none;padding:12px 20px;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;width:95%}
#chat{display:none;flex-direction:column;height:90vh}
#msgs{flex:1;overflow-y:auto;padding:15px}
.msg{margin:8px 0;padding:10px 14px;border-radius:12px;max-width:80%}
.user{background:#005c4b;margin-left:auto}
.ai{background:#202c33}
#box{display:flex;padding:10px;background:#202c33}
#box input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
#box button{background:#00a884;border:none;color:white;padding:10px 18px;border-radius:50%;margin-left:8px;font-size:18px}
</style>
</head>
<body>
<div class="header">🤖 SUPER META IA</div>

<div id="paywall">
<h2>🔒 SUPER META IA</h2>
<p><b>SÓ 150 MT / MÊS</b></p>
<p>Paga no M-Pesa:<br><b>85 584 8278</b><br>Nome: Helton</p>
<p>Manda o comprovativo no WhatsApp e recebe o teu código.</p>
<input id="codigo" placeholder="ESCREVE O TEU CÓDIGO AQUI">
<br>
<button onclick="desbloquear()">DESBLOQUEAR 🔓</button>
<p id="erro" style="color:red"></p>
<p style="font-size:12px;color:#666">Ex: META-150 ou DONO-HELTON</p>
</div>

<div id="chat">
<div id="msgs"></div>
<div id="box">
<input id="pergunta" placeholder="Escreve aqui...">
<button onclick="enviar()">➤</button>
</div>
</div>

<script>
const CODIGOS_VALIDOS = ["META-150", "META-100", "DONO-HELTON"];

if(localStorage.getItem("acesso") === "ok"){
  document.getElementById("paywall").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  boasVindas();
}

function desbloquear(){
  let c = document.getElementById("codigo").value.trim().toUpperCase();
  if(CODIGOS_VALIDOS.includes(c)){
    localStorage.setItem("acesso", "ok");
    document.getElementById("paywall").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    boasVindas();
  } else {
    document.getElementById("erro").innerText = "Código inválido. Verifica e tenta de novo.";
  }
}

function boasVindas(){
  let msgsDiv = document.getElementById("msgs");
  if(msgsDiv.innerHTML.trim() === ""){
    addMsg("Olá! Tudo bem? Eu sou a SUPER META IA. Como posso ajudar-te hoje?","ai");
  }
}

function addMsg(texto, quem){
  let d = document.createElement("div");
  d.className = "msg " + quem;
  d.innerText = texto;
  let msgsDiv = document.getElementById("msgs");
  msgsDiv.appendChild(d);
  msgsDiv.scrollTop = msgsDiv.scrollHeight;
}

async function enviar(){
  let input = document.getElementById("pergunta");
  let texto = input.value.trim();
  if(!texto) return;
  
  addMsg(texto, "user");
  input.value = "";
  addMsg("A pensar...", "ai");
  
  let msgs = document.getElementById("msgs");
  try{
    let prompt = "Tu és a SUPER META IA. Fala SEMPRE em Português de Portugal, de forma natural e simples. Pergunta do utilizador: " + texto;
    let res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt));
    let resposta = await res.text();
    
    msgs.lastChild.remove(); // Remove o "A pensar..."
    addMsg(resposta, "ai");
  }catch(e){
    msgs.lastChild.remove();
    addMsg("Desculpa, houve um erro na ligação. Tenta de novo, por favor.", "ai");
  }
}

document.getElementById("pergunta").addEventListener("keypress", function(e){ 
  if(e.key === "Enter") enviar(); 
});
</script>
</body>
</html>
